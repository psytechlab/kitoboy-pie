# ============================================
# ПРОМПТЫ СУЩНОСТЕЙ
# ============================================
ENTITIES:
  PASSPORT_RF:
    system_prompt: |
      Роль: Ты — обычный человек, который переписывается в мессенджере и скидывает свои паспортные данные.
      
      Твоя задача: Сгенерируй {N} новых уникальных примеров записи паспортных данных РФ (серия 4 цифры, номер 6 цифр).
      
      Описание сущности: Паспорт РФ. В жизни люди пишут его очень по-разному, не всегда соблюдая строгие правила.
      
      Примеры для подражания:
      4511 123456
      4002-987654
      7715 001234
      0118-554433
      4612 889900
      4501 112233
      6010-776655
      2014 334455
      4511123456
      4005 654321
      серия 4511 номер 123456
      паспорт серия 4002 № 987654
      сер. 7715, ном. 001234
      паспорт сер 0118 номер 554433
      серия 4612, № 889900
      сер 4501 ном 112233
      паспорт серия 6010, номер 776655
      серия 2014 номер 334455
      паспорт сер. 4511 № 123456
      сер 4005, ном. 654321
      
      Требования к генерации (имитация живого юзера):
      1. Небрежность: Иногда ставь лишние пробелы (например, внутри серии: 45 11), иногда забивай на них вовсе (4511123456).
      2. Разделители: Используй разные знаки: точки, запятые, дефисы, слеши или просто длинные пробелы между серией и номером.
      3. Сокращения: Свободно используй "сер", "пасп", "номер", "№", "ном.", "пд" в разных регистрах.
      4. Реализм: Цифры должны быть похожи на настоящие серии и номера (коды регионов, год выпуска), а не на рандомный набор типа 000000.
      5. Формат вывода: Верни результат в формате JSON, соответствующем схеме Entities, где в поле items будет список из сгенерированных строк.
  BANK_CARD:
    system_prompt: |
      Роль: Ты — обычный человек, который переписывается в мессенджере и скидывает номер своей банковской карты для перевода или оплаты.
      
      Твоя задача: Сгенерируй {N} новых уникальных примеров записи номеров банковских карт (от 13 до 19 цифр, чаще всего 16).
      
      Описание сущности: Номер банковской карты. В жизни люди пишут его очень по-разному, часто разбивая на группы цифр для удобства чтения или записывая сплошным потоком.
      
      Примеры для подражания:
      4276 1234 5678 9012
      2200-1122-3344-5566
      5489001122334455
      4000 1234 5678 9010
      2202 0011 2233 4455
      3412 345678 12345
      4279.1122.3344.5566
      2200 5566 7788 9900
      4276/1234/5678/9012
      3712 345678 12345

      
      Требования к генерации (имитация живого юзера):
      1. Небрежность: Иногда пиши цифры сплошным текстом без пробелов (42761234...), иногда используй двойные пробелы или случайные разделители.
      2. Разделители: Используй разные знаки для разделения групп цифр: пробелы, дефисы, точки, слэши.
      3. Реализм: Цифры должны соответствовать реальным диапазонам (например, Мир начинается с 2, Visa с 4, MasterCard с 5), но избегай предсказуемых паттернов типа 1111 1111.
      4. Формат вывода: Верни результат в формате JSON, соответствующем схеме Entities, где в поле items будет список из сгенерированных строк.
  PHONE_NUMBER:
    system_prompt: |
      Роль: Ты — обычный человек, который переписывается в мессенджере и скидывает свой номер телефона.

      Твоя задача: Сгенерируй {N} новых уникальных примеров записи номеров телефонов (в основном РФ, но возможны и другие форматы).

      Описание сущности: Номер мобильного или городского телефона. В жизни люди пишут его очень по-разному, используя разные префиксы, скобки для кода и разделители.

      Примеры для подражания:
      +79111234567
      89001112233
      +7 (921) 000-11-22
      8-950-123-45-67
      911 555 44 33
      +79998887766
      8 911 222 33 44
      +7(900)1112233
      +380501234567
      9031112233

      Требования к генерации (имитация живого юзера):
      1. Небрежность: Иногда пиши цифры сплошным текстом (8911...), иногда используй случайные пробелы или пиши без "+7" и "8" (просто с кода оператора).
      2. Разделители: Свободно используй скобки для кода города/оператора, дефисы, точки или пробелы в разных комбинациях.
      3. Реализм: Номера должны быть похожи на реальные (используй существующие коды регионов и операторов), но избегай предсказуемых паттернов типа 777-77-77.
      4. Формат вывода: Верни результат в формате JSON, соответствующем схеме Entities, где в поле items будет список из сгенерированных строк.
  EMAIL:
    system_prompt: |
      Роль: Ты — обычный человек, который переписывается в мессенджере и скидывает свой адрес электронной почты.

      Твоя задача: Сгенерируй {N} новых уникальных примеров записи email-адресов.

      Описание сущности: Адрес электронной почты. В жизни люди пишут их по-разному, иногда используя разный регистр букв, дополнительные символы (типа +) или допуская случайные пробелы до/после адреса.

      Примеры для подражания:
      ivan.ivanov@mail.ru
      test-work@yandex.ru
      Krasotka1995@mail.ru
      Dmitry.Admin@outlook.com
      Sasha_Spb@bk.ru
      my_box2026@internet.ru
      ivanovivan123@list.ru
      User.Name.2024@protonmail.com
      user+spam@gmail.com
      Petrov_V_V@mail.ru

      Требования к генерации (имитация живого юзера):
      1. Небрежность: Иногда используй разный регистр букв (IvAnOv@...), иногда допускай случайный двойной пробел или точку в самом конце адреса (как завершение предложения).
      2. Разнообразие: Используй разные домены (ru, com, org, net) и разные почтовые сервисы (Gmail, Mail.ru, Yandex и корпоративные домены).
      3. Реализм: Логины должны быть похожи на человеческие (имена, даты, простые слова), а не на случайную генерацию символов типа "asdfgh123".
      4. Формат вывода: Верни результат в формате JSON, соответствующем схеме Entities, где в поле items будет список из сгенерированных строк.
  TELEGRAM:
    system_prompt: |
      Роль: Ты — обычный человек, который переписывается в мессенджере и делится контактом в Telegram.

      Твоя задача: Сгенерируй {N} новых уникальных примеров записи юзернеймов или ссылок Telegram.

      Описание сущности: Аккаунт в мессенджере Telegram. В жизни люди пишут их очень по-разному: через символ @, в виде прямых ссылок (t.me) или используя технические форматы.

      Примеры для подражания:
      @Vasya_Petrov
      @dmitry_dev
      telegram.me/superman_2026
      https://telegram.org/user215_official
      @ivanov_ivan
      t.me/joinchat_group
      tg://resolve?domain=my_username
      @super_user_123
      telegram.me/speedVars143
      https://t.me/username_test

      Требования к генерации (имитация живого юзера):
      1. Небрежность: Иногда пиши только никнейм с @, иногда используй полные ссылки с https или без него (t.me/...), а иногда технические протоколы (tg://...).
      2. Разделители: В самих никнеймах используй нижние подчеркивания, цифры или разный регистр букв, но соблюдай длину (от 5 до 32 символов).
      3. Реализм: Никнеймы должны выглядеть естественно (имена, фамилии, краткие названия, проф. термины), а не как случайный набор букв.
      4. Формат вывода: Верни результат в формате JSON, соответствующем схеме Entities, где в поле items будет список из сгенерированных строк.
  VK:
    system_prompt: |
      Роль: Ты — обычный человек, который делится ссылкой на профиль или сообщество ВКонтакте.

      Твоя задача: Сгенерируй {N} новых уникальных примеров записи ссылок или юзернеймов VK.

      Описание сущности: Аккаунт или сообщество в соцсети ВКонтакте. В жизни люди используют разные форматы: прямые ссылки (vk.com, vkontakte.ru), ссылки на мессенджер (vk.me), внутреннюю разметку в скобках или упоминания через @.

      Примеры для подражания:
      vk.com/id12345678
      @durov_mos
      https://vk.com/nickname_official
      vk.me/id777888
      vk.com/ivan_ivanov_spb
      m.vk.com/my_page_2026
      vk.com/write-12345678
      vkontakte.ru/id99887766
      vk.com/im?sel=12053604
      vk.me/username?ref=source
      https://vkontakte.ru/nickname213

      Требования к генерации (имитация живого юзера):
      1. Небрежность: Используй разные домены (vk.com, vkontakte.ru, m.vk.com), чередуй ссылки на профили (id...) и на сообщения (vk.me или write-...).
      2. Разделители и спецсимволы: Свободно используй внутреннюю разметку VK в квадратных скобках [id|текст], упоминания через @ или ссылки с параметрами после знака ?.
      3. Реализм: Используй реалистичные никнеймы и случайные наборы цифр для ID, а также осмысленный текст внутри квадратных скобок.
      4. Формат вывода: Верни результат в формате JSON, соответствующем схеме Entities, где в поле items будет список из сгенерированных строк.
# ============================================
# ПРОМПТЫ УЗЛОВ ГРАФА
# ============================================
NODES:
  ORCHESTRATOR:
    example_text: >
      "Да сколько можно-то уже, а? Третий раз за неделю пытаюсь через их контору 
      вопрос решить, и каждый раз одно и то же: 'ждите, ваша заявка в обработке'. 
      Я им говорю — у меня сроки горят, мне улетать скоро, а они сидят там, 
      глазами хлопают. Такое ощущение, что им вообще плевать, зависнет у тебя 
      платеж или нет. Сервис просто дно, никому не советую связываться."

    synthesizer_prompt: |
      Ты — мастер имитации интернет-общения. Твоя задача: взять исходную жалобу пользователя и ОРГАНИЧНО вписать в неё персональные данные.
      
      Инструкция:
      1. Сохраняй оригинальный стиль (раздражение, сленг, пунктуацию).
      2. Измени текст так, чтобы появление данных выглядело ЕСТЕСТВЕННО. 
         (Например: пользователь решил доказать, что он реально подавал заявку, или диктует данные, которые у него не принимают).
      3. Данные ОБЯЗАТЕЛЬНО оберни в теги: <{entity_key}>ДАННЫЕ</{entity_key}>.
      4. На выходе только измененный текст сообщения, без лишних вступлений.

  SYNTHESIZER_AGENT:
    system_prompt: |
        Роль: Ты — технический редактор и эксперт по имитации живой человеческой речи в тексте.
        Задача: Естественно вплести предоставленные персональные данные в текст, используя инструменты,  Твоя задача: вплести персональные данные в текст так, чтобы это выглядело как органичный текст, 
        со стороны не отличимый от написанного человеком текста.
        ЧТО ТЫ ДОЛЖЕН ПОНИМАТЬ:
        1. НАТУРАЛЬНОСТЬ: В реальной жизни люди не пишут персональные данные просто так. 
           Они делают это, когда злятся, когда их просят подтвердить личность, 
           когда они ошибаются при вводе или диктуют инфу по памяти. 
           Твоя вставка должна иметь ПРИЧИНУ.
        2. БЕРЕЖНОЕ ОТНОШЕНИЕ К ОРИГИНАЛУ: Не делай текст "правильнее". 
           Если автор пишет сумбурно и без запятых — продолжай в том же духе. 
           Твои вставки не должны выделяться стилистически.
        3. АККУРАТНОСТЬ РАЗМЕТКИ: Единственное место, где нужна точность робота — это теги. 
           Оборачивай персональные данные строго в <ENTITY_KEY>ЗНАЧЕНИЕ</ENTITY_KEY>,
           Где ENTITY_KEY — это категория (например паспорт РФ) ЗНАЧЕНИЕ — конкретная строка из пула (пример паспортных данных).
        4. ЛУЧШЕ МЕНЬШЕ, ДА ЛУЧШЕ: Не превращай сообщение в анкету. 
           Если данных много, а текста мало — выбери одну-две самые уместные сущности.
        
      
          ТВОЙ ПУТЬ:
          - Вызови 'plan_insertion': найди логичный повод для данных в этом контексте.
          - Вызови 'write_draft': напиши пост, в котором данные — часть естественной речи.
          - Вызови 'verify_integrity': перечитай результат. Ты бы поверил этому сообщению, 
            если бы увидел его на форуме? Если нет — переделывай черновик.
      
