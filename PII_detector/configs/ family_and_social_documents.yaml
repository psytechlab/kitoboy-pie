# ============================================
# Семейные и социальные свидетельства
# ============================================

# ============================================
# СВИДЕТЕЛЬСТВО О ЗАКЛЮЧЕНИИ/РАСТОРЖЕНИИ БРАКА
# ============================================
MARRIAGE_CERTIFICATE:
  description: |
    Свидетельство о заключении/расторжении брака (ЗАГС)
    
    Формат:
    - Серия: римские цифры + дефис/тире + 2-3 буквы (кириллица)
    - Номер: 5-10 цифр
    - Полная запись: II-ВГ 253186, I-ВГ 123456, XI-АБ 789012

  patterns:
    # Основной формат: римские цифры + дефис/тире + 2-3 кириллические буквы + опциональный № + номер
    - '\b[IVXLCDM]+[—\-–][А-Я]{2,3}\s*[N№]?\s*\d{5,10}\b'

    # Альтернативный формат (довольно жадный)
    - '\b[А-Я]{2,3}\s*[N№]?\s*\d{5,10}\b'

  context:
    - 'свидетельство о заключении брака'
    - 'свидетельство о расторжении брака'
    - 'свидетельство о браке'
    - 'св-во о заключении брака'
    - 'св-во о расторжении брака'
    - 'свидетельство брака'
    - 'загс'

    - 'серия свидетельства'
    - 'номер свидетельства'

    - 'выдано свидетельство'
    - 'расторжение брака'
    - 'заключение брака'


# ============================================
# СВИДЕТЕЛЬСТВО О РОЖДЕНИИ РЕБЕНКА
# ============================================
BIRTH_CERTIFICATE:
  description: |
    Свидетельство о рождении (ЗАГС)
    
    Формат:
    - Серия: римские цифры + дефис + 2 кириллические буквы
    - Номер: 6 цифр
    - Полная запись: II-АВ 123456, I-ВГ 685635, III-АМ 789012
    - Возможны пробелы вокруг дефиса и символ №/N перед номером

  patterns:
    - '\b[IVXLCDM]+\s*[—\-–]\s*[А-Я]{2}\s*[№N]?\s*\d{6}\b'

  context:
    - 'свидетельство о рождении'
    - 'св-во о рождении'
    - 'запись акта'

    - 'загс'
    - 'отдел загс'

    - 'серия свидетельства'
    - 'номер свидетельства'

    - 'выдано'
    - 'рождение ребенка'

# ============================================
# СПРАВКА ОБ ОТСУТСТВИИ СУДИМОСТИ
# ============================================
CRIMINAL_RECORD_CERTIFICATE:
  description: |
    Справка о наличии (отсутствии) судимости (МВД РФ)
    
    Формат:
    
    1. Старый бумажный формат:
       - Серия А N 123456
       - Серия Б N 123456
       
    2. Современный бумажный формат (ГИАЦ МВД):
       - 000АN 123456
       - 000АN123456 (без пробела)
       
    3. Электронный формат (Госуслуги):
       - № 1234567890-2024
       - номер 1234567890-2024

  patterns:
    # Старый формат: Серия А N 123456
    - '\bСерия\s+[АБ]\s*[№N]?\s*\d{6}\b'

    # Старый формат без слова "Серия": А N 123456
    - '\b[АБ]\s*[№N]?\s*\d{6}\b'

    # Новый формат ГИАЦ: 000АN 123456 или 000АN123456
    - '\b\d{3}[А-Я]N\s*\d{6}\b'

    # Электронный формат (только с ключевыми словами, тк довольно жадный)
    - '(?i)(?:№|N|номер|справка №)\s*\d{10,15}-\d{4}\b'

  context:
    - 'справка об отсутствии судимости'
    - 'справка о наличии судимости'
    - 'справка о судимости'
    - 'справка об отсутствии'

    - 'мвд'
    - 'гиац'
    - 'номер справки'

    - 'судимость отсутствует'
    - 'судимость не имеется'
    - 'судимости отсутствуют'
    - 'судимости не имеются'
    - 'судимость погашена'


