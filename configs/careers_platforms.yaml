# ============================================
# LINKEDIN
# ============================================
LINKEDIN:
  description: |
    LinkedIn — Career platform and career social media
    
    Формат
    
    1. Основной формат:
       - linkedin.com/in/username
       - xx.linkedin.com/in/username (fr, de, uk, es, it и др.)
       - www.linkedin.com/in/username
       - linkedin.com/in/username/ (с trailing slash)
       
    2. Старые форматы:
       - linkedin.com/pub/username
       
    3. Короткие ссылки (мессенджеры):
       - lnkd.in/abc123
       - https://lnkd.in/abc123
       
    4. Страницы компаний:
       - linkedin.com/company/companyname

  patterns:
    # Основной профиль /in/ (с международным кодом, опциональным www и trailing slash)
    - '(?:https?://)?(?:[a-z]{2}\.)?(?:www\.)?linkedin\.com/in/[a-zA-Z0-9-]{3,30}/?\b'

    # Старый формат /pub/
    - '(?:https?://)?(?:[a-z]{2}\.)?(?:www\.)?linkedin\.com/pub/[a-zA-Z0-9-]{3,30}/?\b'

    # Короткие ссылки lnkd.in
    - 'https?://lnkd\.in/[a-zA-Z0-9_-]+'

    # Страницы компаний
    - '(?:https?://)?(?:[a-z]{2}\.)?(?:www\.)?linkedin\.com/company/[a-zA-Z0-9-]{2,30}/?\b'

  context:
    - 'linkedin'
    - 'линкедин'
    - 'linked in'
    - 'lnkd'

    - 'ищу работу'
    - 'вакансия'
    - 'рекрутер'

    - 'резюме'
    - 'cv'
    - 'анкета'
    - 'сиви'
    - 'связаться'

    - 'соискатель'
    - 'работодатель'
    - 'рекрутер'

    - 'linkedin.com'
    - 'lnkd.in'


# ============================================
# SUPERJOB
# ============================================
SUPERJOB:
  description: |
    SuperJob — Russian career platform
    
    Формат:
    
    1. Резюме:
       - superjob.ru/resume/1234567890.html (цифровой ID)
       - superjob.ru/resume/ivan-ivanov.html (слаг)
       - superjob.ru/resume/1234567890/
       
    2. Вакансии:
       - superjob.ru/vacancy/12345678.html
       
    3. Компании:
       - superjob.ru/employer/123456.html

  patterns:
    # Резюме (цифровой ID)
    - '(?:https?://)?(?:www\.)?superjob\.ru/resume/\d{8,12}(?:\.html)?/?\b'

    # Резюме (slug)
    - '(?:https?://)?(?:www\.)?superjob\.ru/resume/[a-z0-9][a-z0-9-]{2,48}[a-z0-9](?:\.html)?/?\b'

    # Вакансии
    - '(?:https?://)?(?:www\.)?superjob\.ru/vacancy/\d{6,10}(?:\.html)?/?\b'

    # Компании
    - '(?:https?://)?(?:www\.)?superjob\.ru/employer/\d{6,8}(?:\.html)?/?\b'

  context:
