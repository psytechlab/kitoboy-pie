# ============================================
# Трек-номера
# ============================================


# ============================================
# ТРЕК-НОМЕР ПОЧТЫ РОССИИ (ВНУТРЕННИЙ)
# ============================================
TRACK_RUSSIAN_POST:
  description: |
    Трек-номер внутренних отправлений Почты России — 14 цифр
    
    Формат:
    - Индекс отправителя (6 цифр)
    - Месяц (2 цифры)
    - Уникальный номер (5 цифр)
    - Контрольная сумма (1 цифра)
    
    Пример: 12345678901234, 123456 78 90123 4

  patterns:
    # Слитный вариант
    - '\b\d{14}\b(?!\d)'

    # С разделителями (как на чеке)
    - '\b\d(?:[ -]?\d){13}\b'

  context:
    - 'трек'
    - 'трек номер'
    - 'посылка'
    - 'письмо'
    - 'отправление'
    - 'почта'
    - 'почта россии'
    - 'трекномер'


# ============================================
# МЕЖДУНАРОДНЫЙ ТРЕК-НОМЕР (S10)
# ============================================
TRACK_INTERNATIONAL:
  description: |
    Международный трек-номер (стандарт UPU S10) — 13 символов
    
    Формат:
    - 2 буквы (тип отправления) + 8 цифр + 1 контрольная цифра + 2 буквы (код страны)
    - Пример: RA123456789RU, EA123456789CN
    
    Контрольная сумма рассчитывается по алгоритму MOD 11

  patterns:
    # 2 буквы + 9 цифр + 2 буквы
    - '\b[A-Z]{2}\d{9}[A-Z]{2}\b'

  context:
    - 'трек'
    - 'трек номер'
    - 'трек-номер'
    - 'международный трек'
    - 'посылка'
    - 'письмо'
    - 'заказное письмо'
    - 'ems'
    - 'алиэкспресс'
    - 'aliexpress'
    - 'али'
    - 'joom'
    - 'почта'
    - 'таобао'
    - 'taobao'