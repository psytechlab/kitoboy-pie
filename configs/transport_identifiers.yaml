# ============================================
# Transport Identificators
# ============================================


# ============================================
# VIN (Vehicle Identification Number)
# ============================================
VIN:
  description: |
    VIN — идентификационный номер транспортного средства.
    
    Формат:
    - Строго 17 символов
    - Цифры 0-9 и буквы A-Z (кроме I, O, Q)
    - Без пробелов и дефисов

  patterns:
    - '\b[0-9A-HJ-NPR-Z]{17}\b'

  context:
    - 'vin'
    - 'вин'
    - 'номер кузова'
    - 'кузовной номер'


# ============================================
# ГОСУДАРСТВЕННЫЙ РЕГИСТРАЦИОННЫЙ ЗНАК (АВТОНОМЕР)
# ============================================
LICENSE_PLATE_RU:
  description: |
    Российский государственный регистрационный знак (автомобильный номер)
    
    Формат (согласно ГОСТ):
    - 1 буква (А, В, Е, К, М, Н, О, Р, С, Т, У, Х)
    - 3 цифры (основной номер)
    - 2 буквы (А, В, Е, К, М, Н, О, Р, С, Т, У, Х)
    - 2 или 3 цифры (код региона)
    
    Примеры: А111АА777, Х222ХХ178, К333КН33, У444УУ133, М555ММ166

  patterns:
    - '\b[АВЕКМНОРСТУХ]\d{3}[АВЕКМНОРСТУХ]{2}\d{2,3}\b'

  context:
    - 'госномер'
    - 'гос номер'
    - 'автономер'
    - 'государственный регистрационный знак'
    - 'регистрационный знак'
    - 'номер машины'
    - 'номера авто'
    - 'номер авто'
    - 'номера машины'
    - 'номер автомобиля'
    - 'номера автомобиля'


# ============================================
# ПТС (ПАСПОРТ ТРАНСПОРТНОГО СРЕДСТВА)
# ============================================
PTS:
  description: |
    Паспорт транспортного средства (ПТС) — основной документ на автомобиль

    Формат:
    
    1. Бумажный: 77УТ123456 (2 цифры + 2 буквы + 6 цифр)
    
    2. ЭПТС: 164301234567890 (15 цифр)

  patterns:
    # Бумажный ПТС (с возможными разделителями: пробел, дефис)
    - '\b\d{2}[ -]?[А-ЯA-Z]{2}[ -]?\d{6}\b'

    # ЭПТС
    - '\b1643\d{11}\b'


  context:
    - 'птс'
    - 'эптс'
    - 'паспорт транспортного средства'
    - 'паспорт тс'
    - 'техпаспорт'
    - 'автодокумент'
    - 'документы на машину'
    - 'документ на машину'
    - 'паспорт автомобиля'
    - 'паспорт авто'
    - 'паспорт машины'


# ============================================
# СТС (СВИДЕТЕЛЬСТВО О РЕГИСТРАЦИИ ТС)
# ============================================
STS:
  description: |
    Свидетельство о регистрации транспортного средства (СТС)
    
    Формат:
    
    1. Буквенная серия: 77УТ123456
    
    2. Цифровая серия: 9901123456 (строго 10 цифр подряд)


  patterns:
    # Буквенная серия (с возможными разделителями: пробел, дефис)
    - '\b\d{2}[ -]?[А-ЯA-Z]{2}[ -]?\d{6}\b'

    # Цифровая серия (только слитно, чтобы не ловить телефоны)
    - '\b\d{10}\b'

  context:
    - 'стс'
    - 'свидетельство о регистрации тс'
    - 'св-во о регистрации'

# ============================================
# ОСАГО (ОБЯЗАТЕЛЬНОЕ СТРАХОВАНИЕ)
# ============================================
OSAGO:
  description: |
    Полис ОСАГО — обязательное страхование автогражданской ответственности
    Единый государственный стандарт, бланки Гознака
    
    Формат:
    - Серия: 3 буквы (кириллица, но возможны латинские дубли)
    - Номер: 10 цифр
    - Полная запись: МММ 1234567890 или XXX1234567890
    - Серия и номер неразрывны в базах и документах

  patterns:
    # 3 буквы серии (с поддержкой латиницы) + опциональный разделитель + 10 цифр
    - '\b[АВЕКМНОРСТУХABEKMHOPCTYX]{3}[ -]?\d{10}\b'

  context:
    - 'осаго'
    - 'е-осаго'
    - 'автострахование'
    - 'обязательное страхование'
    - 'страховка авто'

