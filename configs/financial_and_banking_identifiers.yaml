# ============================================
# ЮMONEY (ЯНДЕКС.ДЕНЬГИ)
# ============================================
YMONEY:
  description: |
    ЮMoney — электронный кошелек (бывший Яндекс.Деньги)
    
    Формат:
    - 16 цифр, начинается с 41001
    - Может писаться с пробелами/дефисами
    - Пример: 4100112345678901, 4100 1123 4567 8901

  patterns:
    - '\b41001(?:[\s\-]?\d){11}\b(?!\d)'

  context:
    - 'юmoney'
    - 'юмани'
    - 'яндекс деньги'
    - 'яндекс.деньги'
    - 'яндекс кошелек'
    - 'кошелек яндекс'
    - 'yoomoney'
    - 'якарта'


# ============================================
# WEBMONEY (КОШЕЛЕК)
# ============================================
WEBMONEY_PURSE:
  description: |
    WebMoney — электронный кошелек (валютный счет)
    WMID — уникальный 12-значный идентификатор пользователя WebMoney
    
    Формат:
    - Валютный счёт:
        Буква (R, Z, E, U) + 12 цифр
        R — рубли, Z — доллары, E — евро, U — гривны
        Пример: R123456789012
    - WMID:
        12 цифр
        Пример: 123456789012
        Очень жадный паттерн, так что обязательно смотрим контекст 

  patterns:
    - '\b[RZEU]\d{12}\b' # Валютный счёт
    - '\b\d{12}\b(?!\d)' # WMID

  context:
    - 'webmoney'
    - 'вебмани'
    - 'wm'
    - 'wmz'
    - 'wmr'
    - 'wme'
    - 'wmu'
    - 'кошелек webmoney'
    - 'wm кошелек'
    - 'wmid'
    - 'вмид'
    - 'мой wmid'

