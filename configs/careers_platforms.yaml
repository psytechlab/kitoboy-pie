# ============================================
# HH.RU (HEADHUNTER)
# ============================================
HH:
  description: |
    HeadHunter (hh.ru) — Russian career platform

    Формат:

    1. Резюме (Resume ID):
       - hh.ru/resume/ab1234567890abcdef1234567890abcdef (38-значный hex-хэш)
       - hh.ru/resume/1234567890 (старый цифровой формат)
       - m.hh.ru/resume/...
       - spb.hh.ru/resume/... (региональные поддомены)

    2. Вакансия (Vacancy ID):
       - hh.ru/vacancy/123456789 (цифровой ID)

    3. Компания (Employer ID):
       - hh.ru/employer/123456 (цифровой ID)

    4. Письма/отклики (Letter ID):
       - hh.ru/letter/12345678 (цифровой ID)

    5. Короткие ссылки из мобильного приложения:
       - hhru.page.link/abc123

  patterns:
    # Резюме: 38-значный hex-хэш (основной современный формат)
    - '(?:https?://)?(?:[a-z.-]+\.)?hh\.ru/resume/[a-f0-9]{38}(?:\?\S+)?\b'

    # Резюме: старый цифровой формат (10 цифр)
    - '(?:https?://)?(?:[a-z.-]+\.)?hh\.ru/resume/\d{10}(?:\?\S+)?\b'

    # Вакансия (цифровой ID с запасом длины)
    - '(?:https?://)?(?:[a-z.-]+\.)?hh\.ru/vacancy/\d{5,15}(?:\?\S+)?\b'

    # Компания (цифровой ID)
    - '(?:https?://)?(?:[a-z.-]+\.)?hh\.ru/employer/\d{5,10}\b'

    # Письма/отклики
    - '(?:https?://)?(?:[a-z.-]+\.)?hh\.ru/letter/\d{5,12}\b'

    # Короткие ссылки из мобильного приложения
    - 'https?://hhru\.page\.link/[a-zA-Z0-9]+'

  context:
    - 'hh'
    - 'hh.ru'
    - 'хедхантер'
    - 'headhunter'
    - 'хх'

    - 'резюме'
    - 'cv'
    - 'анкета'
    - 'сиви'

    - 'ищу работу'
    - 'вакансия'
    - 'связаться'

    - 'соискатель'
    - 'работодатель'
    - 'рекрутер'

    - 'соискатель'
    - 'работодатель'
    - 'рекрутер'
    - 'hr'


# ============================================
# HABR КАРЬЕРА (career.habr.com)
# ============================================
HABR_CAREER:
  description: |
    Habr Карьера — Russian IT career platform 
    
    Формат:
    
    1. Профиль пользователя (основной):
       - career.habr.com/username
       - career.habr.com/people/username
       
    2. Профиль компании:
       - career.habr.com/companies/company_name
       
    3. Вакансия:
       - career.habr.com/vacancies/123456 
       
    4. Аккаунт на основном Хабре:
       - habr.com/ru/users/username
       - m.habr.com/ru/users/username (мобильная версия)

  patterns:
    # Профиль пользователя (основной формат)
    - '(?:https?://)?(?:[a-z]+\.)?career\.habr\.com/(?:people/)?[a-zA-Z0-9_-]{3,30}\b'

    # Профиль компании
    - '(?:https?://)?(?:[a-z]+\.)?career\.habr\.com/companies/[a-zA-Z0-9_-]{2,30}\b'

    # Вакансия (во множественном числе, цифровой ID)
    - '(?:https?://)?(?:[a-z]+\.)?career\.habr\.com/vacancies/\d{5,10}\b'

    # Аккаунт на habr.com (основной портал, с опциональным поддоменом)
    - '(?:https?://)?(?:[a-z]+\.)?habr\.com/(?:ru/)?users/[a-zA-Z0-9_-]{3,30}\b'

  context:
    - 'карьера'
    - 'career.habr'
    - 'хабр карьера'
    - 'habr career'
    - 'карьера хабр'

    - 'ищу работу'
    - 'вакансия'
    - 'разработчик'
    - 'программист'
    - 'it специалист'

    - 'резюме на хабре'
    - 'профиль на хабр карьере'
    - 'мой профиль на хабре'
    - 'ссылка на хабр'
    - 'посмотри мой профиль'
    - 'связаться'

    - 'соискатель'
    - 'работодатель'
    - 'рекрутер'

    - 'резюме'
    - 'cv'
