# ============================================
# Документы об образовании
# ============================================

# ============================================
# ДОКУМЕНТ ОБ ОБРАЗОВАНИИ (ДИПЛОМ / АТТЕСТАТ)
# ============================================
EDUCATION_DOC:
  description: |
    Диплом/Аттестат об образовании (школьном, среднем профессиональном или высшем):
  
    Формат:
    - Старый (до 2014): 2-3 буквы + 6 цифр (ВСА 123456, АА 112233)
    - Новый (с 2014): 13 цифр (6 серия + 7 номер)
    - Регистрационный номер: произвольное число после "рег. №"

  patterns:
    # Старый формат: 2-3 буквы + 6 цифр
    - '\b[А-ЯA-Z]{2,3}[\s\-]?\d{6}\b'

    # Новый формат: 13 цифр (слитно или с пробелом)
    - '\b\d{6}[\s]?\d{7}\b'

    # Регистрационный номер
    - '(?i)рег\.?\s?номер\s?[:№]?\s?(\d+)'

  context:
    - 'диплом'
    - 'вуз'
    - 'бакалавр'
    - 'магистр'
    - 'специалист'
    - 'аспирант'
    - 'квалификация'
    - 'ученая степень'

    - 'аттестат'
    - 'школа'
    - 'лицей'
    - 'гимназия'
    - 'среднее образование'

    - 'номер диплома'
    - 'серия аттестата'
    - 'регистрационный номер'
    - 'диплом выдан'
