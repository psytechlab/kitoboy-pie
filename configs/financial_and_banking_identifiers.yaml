# ============================================
# Финансовые и банковские идентификаторы
# ============================================

# ============================================
# БАНКОВСКАЯ КАРТА
# ============================================
BANK_CARD:
  description: |
    Номер банковской карты (PAN — Primary Account Number)
    
    Формат по стандарту ISO/IEC 7812:
    - 16 цифр (стандарт)
    - 15 цифр (American Express)
    - 13-19 цифр (другие)
    
    American Express: формат 4-6-5 (группы 4, 6, 5 цифр)

  patterns:
    # Гибкий паттерн для 16 цифр: любые разделители в любых местах
    - '\b\d{4}(?:[\s\-]?\d){12}\b(?!\d)'

    # American Express (15 цифр) с опциональными разделителями
    - '\b(?:34|37)(?:[\s\-]?\d){13}\b(?!\d)'

    # Другие нестандартные длины (13-19 цифр) - довольно жадный паттерн
    - '\b\d{13,19}\b(?!\d)'

  context:
    - 'карта'
    - 'банковская карта'
    - 'кредитная карта'
    - 'дебетовая карта'
    - 'visa'
    - 'mastercard'
    - 'мир'
    - 'american express'
    - 'amex'
    - 'jcb'
    - 'unionpay'
    - 'карта сбербанка'
    - 'карта тинькофф'
    - 'карта втб'
    - 'озон банк'
    - 'wb банк'
    - 'мтс банк'

    - 'номер карты'
    - 'реквизиты карты'
    - 'оплата картой'
    - 'на карту'
    - 'с карты'
    - 'перевод на карту'
    - 'с карты на карту'
    - 'положить на карту'
    - 'снять с карты'
    - 'скинь номер карты'
    - 'продиктуй карту'


# ============================================
# БАНКОВСКИЙ СЧЕТ
# ============================================
BANK_ACCOUNT:
  description: |
    Банковский счет (расчетный/текущий) — 20-значный идентификатор
    
    Формат:
    - 20 цифр
    - Префиксы: 
      407 (юрлицо), 408 (физлицо/ИП), 301 (корсчет),
      401 (налоги/бюджет), 423 (вклады физлиц), 426 (вклады нерезидентов)
    - Может писаться с пробелами/дефисами в любых местах
    - Без БИК контрольную сумму проверить нельзя (пользователи могут не указывать БИК в сообщениях)

  patterns:
    # Паттерн: префикс + 16 цифр + последняя цифра
    # (?!\d) гарантирует, что после последней цифры нет ещё цифр
    - '\b(?:407|408|301|401|423|426)(?:[\s\-]?\d){16}[\s\-]?\d\b(?!\d)'

  context:
    - 'расчетный счет'
    - 'расчетный счёт'
    - 'р/с'
    - 'р/сч'
    - 'текущий счет'
    - 'лицевой счет'
    - 'л/с'
    - 'банковский счет'
    - 'номер счета'
    - 'счет получателя'

    - 'б/с'
    - 'счет №'
    - 'реквизиты счета'
    - 'платежные реквизиты'
    - 'банковские реквизиты'
    - 'корреспондентский счет'
    - 'к/с'
    - 'кс'
    - 'корсчет'
    - 'депозит'
    - 'счет вклада'
    - 'депозитный счет'
    - 'счет до востребования'

    - 'перевод по реквизитам'
    - 'оплата по счету'
    - 'перечислить на счет'
    - 'зачислить на счет'
    - 'получить на счет'
