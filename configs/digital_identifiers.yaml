# ============================================
# Цифровые идентификаторы
# ============================================

# ============================================
# ТЕЛЕФОН
# ============================================
PHONE:
  description: |
    Номер телефона 
    
    Формат:
    - Международный: +7 916 123-45-67, +380501234567
    - Российский: 8 916 123-45-67, 89161234567
    - Городской: 495 123-45-67
    - Без префикса: 9161234567 (код оператора)

  patterns:
    # Международный формат (с +)
    - '(?<!\d)\+[0-9]{1,4}[\s\(\)\-]{0,3}[0-9]{7,15}(?!\d)'

    # Российский формат (с 8)
    - '(?<!\d)8[\s\(\)\-]{0,3}[0-9]{3}[\s\(\)\-]{0,3}[0-9]{3}[\s\(\)\-]{0,3}[0-9]{2}[\s\(\)\-]{0,3}[0-9]{2}(?!\d)'

    # Российский формат (с кодом оператора 900-999, без 8)
    - '(?<!\d)[9][0-9]{2}[\s\(\)\-]{0,3}[0-9]{3}[\s\(\)\-]{0,3}[0-9]{2}[\s\(\)\-]{0,3}[0-9]{2}(?!\d)'

  context:
    - 'телефон'
    - 'тел'
    - 'моб'
    - 'мобильный'
    - 'звони'
    - 'позвони'
    - 'позвоните'
    - 'свяжись'
    - 'номер'
    - 'т.'
    - 'тлф'

    - 'напиши'
    - 'скинь номер'
    - 'мой номер'
    - 'номер телефона'
    - 'перезвони'
    - 'контакт'

    - 'вотсап'
    - 'whatsapp'
    - 'вацап'
    - 'вайбер'
    - 'viber'
    - 'тг'
    - 'телега'
    - 'телеграм'
    - 'telegram'

    - 'киви'
    - 'qiwi'
    - 'спб'
    - 'по номеру'
    - 'перевод по номеру'
    - 'сбп'
    - 'система быстрых платежей'

    - 'цифры'
    - 'кинь цифры'
    - 'контакт'
    - 'связь'


# ============================================
# EMAIL
# ============================================
EMAIL:
  description: |
    Адрес электронной почты (RFC 5322)
    
    Формат:
    - local@domain.zone
    - local: латиница, цифры, ., _, %, +, -
    - domain: латиница, цифры, ., -
    - zone: латиница, 2+ букв
    
    Примеры:
    - ivan.ivanov@mail.ru
    - user+spam@gmail.com
    - info@yandex.ru
    
    Примечание:
    - Кириллические домены (.рф) не поддерживаются 

  patterns:
    # Стандартный безопасный паттерн (только латиница)
    - '(?<![A-Za-z0-9._%+-])[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}(?![A-Za-z0-9.-])'

  context:
    - 'email'
    - 'e-mail'
    - 'почта'
    - 'эл. почта'
    - 'электронная почта'
    - 'адрес почты'
    - 'мейл'
    - 'mail'
    - 'напиши на почту'
    - 'мыло'
    - 'ящик'
    - '@'


# ============================================
# IP-АДРЕС
# ============================================
IP_ADDRESS:
  description: |
    IP-адрес (IPv4 и IPv6)
    
    IPv4: 4 октета от 0 до 255, разделенных точками
    - Пример: 192.168.1.1, 10.0.0.1, 255.255.255.0
    
    IPv6: 8 групп по 4 шестнадцатеричных цифры, разделенных двоеточиями
    - Пример: 2001:db8::1, fe80::1, ::1, ::ffff:192.168.1.1

  patterns:
    # IPv4 с проверкой диапазона 0-255
    - '(?<!\d)(25[0-5]|2[0-4][0-9]|[01]?[0-9][0-9]?)\.(25[0-5]|2[0-4][0-9]|[01]?[0-9][0-9]?)\.(25[0-5]|2[0-4][0-9]|[01]?[0-9][0-9]?)\.(25[0-5]|2[0-4][0-9]|[01]?[0-9][0-9]?)(?!\d)'

    # IPv6 полный формат (8 групп)
    - '(?<![:\da-fA-F])(?:[0-9a-fA-F]{1,4}:){7}[0-9a-fA-F]{1,4}(?![:\da-fA-F])'

    # IPv6 с сокращением :: (в середине или в конце)
    - '(?<![:\da-fA-F])(?:(?:[0-9a-fA-F]{1,4}:){0,6}(?:[0-9a-fA-F]{1,4})?::(?:[0-9a-fA-F]{1,4}:){0,6}[0-9a-fA-F]{1,4})(?![:\da-fA-F])'

  context:
    - 'ip'
    - 'айпи'
    - 'айпишник'
    - 'ip-адрес'
    - 'сервер'
    - 'vpn'
    - 'прокси'
    - 'сеть'
    - 'локальный'
    - 'внешний'
