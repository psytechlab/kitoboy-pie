# ============================================
# ЛИЧНЫЕ ДОКУМЕНТЫ
# ============================================

# ============================================
# ПАСПОРТ РФ
# ============================================
PASSPORT_RF:
  description: |
    Паспорт гражданина РФ
    Форматы:
    - 4501 123456 
    - 4501-123456 
    - 4501123456 
    - серия 4501 номер 123456 

  patterns:
    - '\b\d{4}[ -]?\d{6}\b'  # основной формат (4 цифры + 6 цифр)
    - '(?:серия|сер\.?|паспорт\s+(?:серия|сер\.?))\s*(\d{4})[,\s]+(?:номер|№|ном\.?)\s*(\d{6})'  # с явными словами

  context:
    - 'паспорт'
    - 'паспорта'
    - 'паспорте'
    - 'паспортом'
    - 'серия'
    - 'сер'
    - 'номер'
    - '№'
    - 'выдан'
    - 'выдача'
    - 'удостоверение личности'
    - 'паспортные данные'
    - 'пд'
    - 'passport'


# ============================================
# ЗАГРАНПАСПОРТ РФ
# ============================================
PASSPORT_INTERNATIONAL:
  description: |
    Загранпаспорт РФ
    Форматы:
    - 75МТ 123456 (старый образец: 2 цифры + 2 буквы + 6 цифр)
    - 52 0056743 (новый образец: 2 цифры + 7 цифр)
    - 520056743 (слитно для нового образца)
    - 75МТ123456 (слитно для старого образца)

  patterns:
    - '\b\d{2}[A-ZА-Я]{2}[ -]?\d{6}\b'  # старый образец (2 цифры + 2 буквы + 6 цифр)
    - '\b\d{2}[ -]?\d{7}\b'               # новый образец (2 цифры + 7 цифр)

  context:
    - 'загранпаспорт'
    - 'загран'
    - 'заграничный'
    - 'паспорт международный'
    - 'passport'
    - 'биометрический загранпаспорт'
    - 'старого образца'
    - 'нового образца'


# ============================================
# ВОДИТЕЛЬСКОЕ УДОСТОВЕРЕНИЕ РФ
# ============================================
DRIVER_LICENSE:
  description: |
    Водительское удостоверение РФ (нового образца)
    Форматы:
    - 77НО 123456 (2 цифры + 2 буквы + 6 цифр)
    - 7701 123456 (4 цифры + 6 цифр)
    - 77НО123456 (слитно)
    - 7701123456 (слитно)
    Буквы только из набора: А, В, Е, К, М, Н, О, Р, С, Т, У, Х

  patterns:
    - '\b\d{2}[ -]?[АВЕКМНОРСТУХ]{2}[ -]?\d{6}\b'  # формат с буквами
    - '\b\d{4}[ -]?\d{6}\b'                          # формат без букв

  context:
    - 'водительское'
    - 'удостоверение'
    - 'права'
    - 'ВУ'
    - 'водительские права'
    - 'водительское удостоверение'
    - 'национальное водительское'
    - 'driver license'
    - 'driving license'

# ============================================
# СНИЛС
# ============================================
SNILS:
  description: |
    Страховой номер индивидуального лицевого счета
    Форматы:
    - 123-456-789 00 (стандарт)
    - 123-456-789-00 (с дефисом вместо пробела)
    - 123 456 789 00 (с пробелами)
    - 12345678900 (слитно)

  patterns:
    - '\b\d{3}[- ]?\d{3}[- ]?\d{3}[- ]?\d{2}\b'  # все форматы СНИЛС

  context:
    - 'снилс'
    - 'СНИЛС'
    - 'страховой номер'
    - 'пенсионное'
    - 'пенсионный'
    - 'страховое свидетельство'
    - 'зеленая карточка'
    - 'ПФР'
    - 'СФР'
    - 'индивидуальный лицевой счет'
    - 'пенсионный фонд'

# ============================================
# ИНН ФИЗИЧЕСКОГО ЛИЦА
# ============================================
INN_INDIVIDUAL:
  description: |
    Идентификационный номер налогоплательщика для физического лица
    Форматы:
    - 123456789012 (12 цифр)
    - 1234 567890 12 
    - 1234-567890-12 

  patterns:
    - '\b\d{4}[ -]?\d{6}[ -]?\d{2}\b'

  context:
    - 'инн'
    - 'ИНН'
    - 'идентификационный номер'
    - 'налоговый номер'
    - 'individual tax number'
    - 'физ инн'
    - 'ФИЗ ИНН'
# ============================================
# ИНН ЮРИДИЧЕСКОГО ЛИЦА / ИП
# ============================================
INN_LEGAL:
  description: |
    Идентификационный номер налогоплательщика для организации или ИП
    Форматы:
    - 1234567890 (10 цифр)
    - 1234 567890
    - 1234-567890

  patterns:
    - '\b\d{4}[ -]?\d{6}\b'

  context:
    - 'инн'
    - 'ИНН'
    - 'идентификационный номер'
    - 'налоговый номер'
    - 'юр инн'
    - 'ЮР ИНН'

# ============================================
# ВОЕННЫЙ БИЛЕТ РФ
# ============================================
MILITARY_ID:
  description: |
    Военный билет (удостоверение личности военнослужащего)
    Форматы:
    - АБ 1234567 (серия 2 буквы + пробел + 7 цифр)
    - АБ1234567 (слитно)
    - АБ-1234567 (с дефисом)
    Серия: 2 буквы
    Номер: 7 цифр

  patterns:
    - '\b[А-Я]{2}[ -]?\d{7}\b'

  context:
    - 'военный билет'
    - 'военник'
    - 'военный документ'
    - 'удостоверение личности военнослужащего'

# ============================================
# ПОЛИС ОМС
# ============================================
OMS:
  description: |
    Полис обязательного медицинского страхования
    Форматы:
    - 1234567890123456 (16 цифр) — старый и новый образец
    - 001234567 (9 цифр, начинается с 001) — временное свидетельство

  patterns:
    - '\b\d{4}[ -]?\d{4}[ -]?\d{4}[ -]?\d{4}\b'  # 16 цифр с разделителями или без
    - '\b001\d{6}\b'                               # временное свидетельство

  context:
    - 'полис'
    - 'омс'
    - 'обязательное медицинское страхование'
    - 'медицинский полис'
    - 'полис омс'
    - 'временное свидетельство омс'
    - 'временный полис'
    - 'временный омс'
    - 'временный полис омс'

# ============================================
# УДОСТОВЕРЕНИЕ БЕЖЕНЦА
# ============================================
REFUGEE_ID:
  description: |
    Удостоверение беженца (РФ)
    Форматы:
    - 321234567 (2 цифры серия + 7 цифр номер, слитно)
    - 32 1234567 (с пробелом)
    - 32-1234567 (с дефисом)
    Серия: 2 цифры
    Номер: 7 цифр

  patterns:
    - '\b\d{2}[ -]?\d{7}\b'  # 2 цифры + 7 цифр с возможными разделителями

  context:
    - 'удостоверение беженца'
    - 'удостоверение беженца РФ'
    - 'удостоверение беженца Российской Федерации'
    - 'refugee id'
    - 'refugee document'
    - 'удостоверение беженца серия'

# ============================================
# ВИД НА ЖИТЕЛЬСТВО (ВНЖ)
# ============================================
RESIDENCE_PERMIT:
  description: |
    Вид на жительство в РФ
    Форматы:
    
    Для иностранных граждан:
    - 82 N 1234567 (с буквой N)
    - 82 1234567 (без N)
    - 83 N 1234567
    - 83 1234567
    
    Для лиц без гражданства:
    - 80 1234567 (7 цифр)
    - 81 1234567
    - 90 1234567 (с биометрией)
    
    Возможны слитные варианты

  patterns:
    - '\b(?:82|83)[ -]?N?[ -]?\d{7}\b'  # иностранные граждане
    - '\b(?:80|81|90)[ -]?\d{7}\b'       # лица без гражданства

  context:
    - 'вид на жительство'
    - 'внж'
    - 'вид на жительство лица без гражданства'
    - 'разрешение на жительство'
    - 'residence permit'
    - 'внж рф'
    - 'вид на жительство лбг'

# ============================================
# УДОСТОВЕРЕНИЕ ВЕТЕРАНА БОЕВЫХ ДЕЙСТВИЙ
# ============================================
COMBAT_VETERAN_ID:
  description: |
    Удостоверение ветерана боевых действий
    Форматы:
    - На бумажном бланке: "серия ВВ № 1234567" или "серия ВВ 1234567"
    - На пластиковой карте: "Удостоверение серия ____ N ______"
    
    Особенности:
    - Серия: 2 буквы (кириллица)
    - Номер: 6-7 цифр
    - Слова "серия" и "номер" опциональны

  patterns:
    # Со словами "серия" и опциональным "номер/№/N"
    # Разделители: пробел, табуляция, запятая, дефис (любое количество)
    - '(?:серия|сер\.?)\s*([А-Яа-я]{2})[, \t-]*?(?:номер|№|N)?[ \t-]*?(\d{6,7})'

    # Компактный формат "ВВ 1234567" (без слов)
    # С возможными разделителями между буквами и цифрами
    - '\b[А-Яа-я]{2}[ \t-]?\d{6,7}\b'

  context:
    - 'ветеран боевых действий'
    - 'вбд'
    - 'участник боевых действий'
    - 'удостоверение ветерана боевых действий'
    - 'удостоверение ветерана бд'
    - 'удостоверение вбд'

# ============================================
# УДОСТОВЕРЕНИЕ МНОГОДЕТНОЙ СЕМЬИ (НОВЫЙ ФЕДЕРАЛЬНЫЙ ОБРАЗЕЦ)
# ============================================
LARGE_FAMILY_ID:
  description: |
    Удостоверение многодетной семьи (единый федеральный образец с 2024)
    
    Особенности:
    - НЕТ серии (только номер)
    - Номер: от 6 до 10 цифр 
    - На бланке: "УДОСТОВЕРЕНИЕ № ______"
    - Номер записи в региональном реестре

  patterns:
    # С явным указанием номера
    - '(?:удостоверение|№|N|номер)[:\s]*(\d{6,10})'

    # Просто цифры
    - '\b\d{6,10}\b'

  context:
    - 'удостоверение многодетной семьи'
    - 'удостоверение многодетной'
    - 'удостоверение многодетных'
    - 'статус многодетной семьи'
    - 'единый образец удостоверения'
    - 'федеральное удостоверение многодетных'

# ============================================
# УДОСТОВЕРЕНИЕ ЛИЧНОСТИ МОРЯКА (УЛМ)
# ============================================
SEAFARER_ID:
  description: |
    Удостоверение личности моряка (РФ)
    
    Особенности:
    - Серия: всегда RUS (код государства)
    - Номер: 7 цифр
    - Полный номер: RUS + 7 цифр
    
    Форматы:
    - RUS 1234567 (с пробелом)
    - RUS-1234567 (с дефисом)
    - RUS1234567 (слитно)

  patterns:
    - '\bRUS[ -]?\d{7}\b'

  context:
    - 'удостоверение личности моряка'
    - 'улм'
    - 'удостоверение моряка'
    - 'seafarer identity'
    - 'seafarer id'
    - 'паспорт моряка'

# ============================================
# ТРУДОВАЯ КНИЖКА
# ============================================
WORK_BOOK:
  description: |
    Трудовая книжка (РФ/СССР с 1974 года)
    
    Форматы серий по годам:
    - АТ-I (1974-1976), АТ-II (1977-1979), АТ-III (1980-1982)
    - АТ-IV (1983-1985), АТ-V (1986-1989), АТ-VI (1990-1992)
    - АТ-VII (1993-1997), АТ-VIII (1998-2000), АТ-IX (2001-2003)
    - АТ-X (2003)
    - ТК (2004-2005), ТК-I (2006-2007), ТК-II (2008-2010)
    - ТК-III (2011-2012), ТК-IV (2013-2015), ТК-V (с 2015)
    - ТК-VI (с 2018)
    
    Особенности:
    - Серия: буквенная (АТ/ТК) + опциональная римская цифра (до X)
    - Номер: 7 цифр (всегда!)

  patterns:
    # Формат с римской цифрой: АТ-III 1234567, ТК-IV 1234567
    - '\b(?:АТ|ТК)(?:-[IVX]+)?[ -]?\d{7}\b'

    # Формат без римской цифры: ТК 1234567
    - '\b(?:АТ|ТК)[ -]?\d{7}\b'

  context:
    - 'трудовая книжка'
    - 'трудовая книга'
    - 'трудовая'
    - 'запись в трудовой'
    - 'дубликат трудовой'