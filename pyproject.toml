[project]
name = "kitoboy-pii"
version = "0.1.0"
description = "Universal PII extraction and synthetic validation data generation"
requires-python = ">=3.11"
dependencies = [
    "arize-phoenix>=11.0.0",
    "datetime>=6.0",
    "faker>=40.0.0",
    "fastapi>=0.135.3",
    "ipykernel>=7.2.0",
    "ipython>=8.0.0",
    "langchain>=0.3.0",
    "langchain-core>=0.3.0",
    "langchain-mistralai>=1.1.2",
    "langchain-ollama>=0.3.0",
    "langgraph>=0.2.0",
    "openinference-instrumentation-langchain>=0.1.0",
    "pydantic>=2.0.0",
    "python-dotenv>=1.0.0",
    "pyyaml>=6.0.0",
    "rstr>=3.2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
package = false
