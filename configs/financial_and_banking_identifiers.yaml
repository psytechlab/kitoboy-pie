# ============================================
# SWIFT/BIC КОД
# ============================================
SWIFT_BIC:
  description: |
    SWIFT/BIC (Bank Identifier Code) — международный идентификатор банка (ISO 9362)
    
    Формат:
    - 8 или 11 символов
    - Только заглавные латинские буквы и цифры
    - Структура: Банк (4) + Страна (2) + Локация (2) + [Отделение (3)]
    - Код отделения XXX означает головной офис
    
    Примеры:
    - SABRRUMM (Сбербанк, головной)
    - PPALUS66XXX (PayPal US)
    - ALFARUMMXXX (Альфа-Банк)

  patterns:
    # 8 или 11 символов: 4 буквы + 2 буквы + 2 буквы/цифры + опционально 3 буквы/цифры
    # (?!\d) защищает от захвата лишних цифр после кода
    - '\b[A-Z]{4}[A-Z]{2}[A-Z0-9]{2}(?:[A-Z0-9]{3})?\b(?!\d)'

  context:
    - 'swift'
    - 'bic'
    - 'swift код'
    - 'bic код'
    - 'swift/bic'
    - 'банковский идентификатор'

    - 'swift код банка'
    - 'bic банка'
    - 'международный перевод'
    - 'перевод за границу'
    - 'swift перевод'

# ============================================
# IBAN (INTERNATIONAL BANK ACCOUNT NUMBER)
# ============================================
IBAN:
  description: |
    IBAN — международный номер банковского счёта (ISO 13616)
    
    Структура:
    - Код страны: 2 буквы (A-Z)
    - Контрольные цифры: 2 цифры
    - BBAN: от 11 до 30 символов (буквы и цифры)
    
    Общая длина: от 15 до 34 символов
    
    Примеры:
    - DE89370400440532013000 (слитно)
    - DE89 3704 0044 0532 0130 00 (с пробелами)
    - FR76 3000 6000 0112 3456 7890 189
    - GB29NWBK60161331926819 (слитно)
    - RU13 0445 2567 8901 2345 6789 0123 4567 890

  patterns:
    # Универсальный паттерн: 2 буквы + 2 цифры + от 11 до 30 букв/цифр с опциональными пробелами и дефисами
    - '\b[A-Z]{2}[0-9]{2}(?:[\s\-]?[A-Z0-9]){11,30}\b'

  context:
    - 'iban'
    - 'ib an'
    - 'международный номер счета'
    - 'international bank account number'

    - 'перевод за границу'
    - 'международный перевод'
    - 'swift перевод'
    - 'переведите'
    - 'поддержите'