# ============================================
# Судебные и исполнительные идентификаторы
# ============================================

# ============================================
# НОМЕР ИСПОЛНИТЕЛЬНОГО ПРОИЗВОДСТВА (ИП)
# ============================================
ENFORCEMENT_PROCEDURE:
  description: |
    Номер исполнительного производства (ИП) — уникальный идентификатор дела в ФССП
    
    Формат:
    - 12345/22/66001-ИП
    - 123456/23/77001-ИП
    - 1234567/24/12345-ИП (актуально с 2024 года)
    
    Структура:
    - Порядковый номер (5-8 цифр, может расти)
    - Год (2 цифры)
    - Код подразделения ФССП (5-6 цифр)
    - Суффикс "-ИП" (кириллицей)

  patterns:
    # Основной паттерн: порядковый номер/год/код-ИП (с запасом)
    - '\b\d{5,8}/\d{2}/\d{5,6}-ИП\b'

  context:
    - 'исполнительное производство'
    - 'исполнительный лист'
    - 'ип'
    - 'фссп'
    - 'судебные приставы'
    - 'приставы'
    - 'возбуждено'
    - 'взыскание'
    - 'долг'
    - 'задолженность'
    - 'постановление'
    - 'исполнительный документ'


# ============================================
# НОМЕР АРБИТРАЖНОГО ДЕЛА
# ============================================
ARBITRATION_CASE:
  description: |
    Номер арбитражного дела (АПК РФ) — уникальный идентификатор дела в арбитражной системе
    
    Формат согласно Постановлению Пленума ВАС РФ № 100:
    - XXX-NNNN/GGGG
    - XXX: индекс арбитражного суда (буква А + цифры)
    - NNNN: порядковый номер (1-5 цифр)
    - GGGG: год (4 цифры)
    
    Примеры:
    - А82-2840/2017
    - A82-2840/2017 (латиница)

  patterns:
    # Основной формат: [АA]XX-NNNN/GGGG (с поддержкой латиницы)
    - '\b[АA][0-9]{1,3}-[0-9]{1,6}/\d{4}\b'

  context:
    - 'арбитражное дело'
    - 'арбитраж'
    - 'дело №'
    - 'дело N'
    - 'апк'
    - 'арбитражный суд'
    - 'кад'
    - 'картотека арбитражных дел'

    - 'рассмотрение дела'
    - 'возбуждено дело'
    - 'решение по делу'
    - 'постановление'
    - 'определение'
    - 'иск'
    - 'истец'
    - 'ответчик'

    - 'банкротство'
    - 'несостоятельность'


# ============================================
# НОМЕР ГРАЖДАНСКОГО/УГОЛОВНОГО ДЕЛА
# ============================================
COURT_CASE_NUMBER:
  description: |
    Номер гражданского/уголовного дела — официальный идентификатор дела в суде
    
    Форматы согласно Инструкции по судебному делопроизводству:
    
    1. Первая инстанция: Х-ХХХ/ГГГГ
       - 1-1005/2025 (уголовное)
       - 2-1234/2024 (гражданское)
       - 2а-45/2023 (административное)
       
    2. Апелляция/кассация: ХХ-ХХХ/ГГГГ
       - 22-5/2019
       - 33-10/2019
       - 33а-6/2019
       
    3. Сложные форматы:
       - 1-3-35/2025 (с кодом здания суда)
       - 1-34/2025(2-134/2024) (двойной номер)
       - М-345/2025 (незавершенное производство)
       
    4. УИД (Уникальный идентификатор дела):
       - 77RS0001-01-2024-000001-01
       - 61RS0005-01-2023-000123-45

  patterns:
    # Первая инстанция: индекс (цифра или цифра+буква) - номер/год (с пробелами)
    - '\b[1-9][а-яa-z]{0,2}\s*-\s*\d{1,6}\s*/\s*\d{4}\b'

    # Апелляция/кассация: двойной индекс - номер/год
    - '\b\d{2}[а-яa-z]{0,2}\s*-\s*\d{1,6}\s*/\s*\d{4}\b'

    # С кодом здания суда: индекс-код-номер/год
    - '\b[1-9]\s*-\s*\d{1,2}\s*-\s*\d{1,6}\s*/\s*\d{4}\b'

    # Двойной номер (дело в скобках)
    - '\b[1-9][а-яa-z]{0,2}\s*-\s*\d{1,6}\s*/\s*\d{4}\s*\(\s*[1-9][а-яa-z]{0,2}\s*-\s*\d{1,6}\s*/\s*\d{4}\s*\)\b'

    # Незавершенное производство (М-номер/год) с поддержкой латиницы
    - '\b[МM]\s*-\s*\d{1,6}\s*/\s*\d{4}\b'

    # УИД (Уникальный идентификатор дела)
    - '\b\d{2}[А-ЯA-Z]{2}\d{4}-\d{2}-\d{4}-\d{6}-\d{2}\b'

  context:
    - 'уголовное дело'
    - 'гражданское дело'
    - 'административное дело'
    - 'дело №'
    - 'дело N'
    - 'номер дела'
    - 'уид'
    - 'уникальный идентификатор дела'

    - 'суд'
    - 'районный суд'
    - 'городской суд'
    - 'мировой судья'
    - 'областной суд'
    - 'ГАС Правосудие'

    - 'рассмотрение дела'
    - 'вступило в силу'
    - 'обжалование'
    - 'возбуждено дело'
    - 'решение по делу'
    - 'постановление'
    - 'определение'
    - 'приговор'
    - 'иск'
    - 'истец'
    - 'ответчик'
    - 'обвиняемый'
    - 'подсудимый'


# ============================================
# НОМЕР СУДЕБНОГО ПРИКАЗА
# ============================================
COURT_ORDER_NUMBER:
  description: |
    Номер судебного приказа — идентификатор судебного постановления по бесспорным требованиям.
    
    Важный момент: Судебный приказ не имеет отдельного номера. Его номер полностью совпадает 
    с номером дела, по которому он вынесен (ст. 127 ГПК РФ, ст. 229.6 АПК РФ, ст. 123.6 КАС РФ).
    
    Форматы:
    
    1. Мировой судья (с номером участка):
       - 2-123/2024
       - 2-123/125/2024
       
    2. Гражданское дело (ГПК РФ):
       - 2-1234/2025
       
    3. Административное дело (КАС РФ):
       - 2а-45/2024
       
    4. Арбитражное дело (АПК РФ):
       - А41-12345/2024

  patterns:
    # Гражданское дело (только индексы 1,2,5,13 + опциональный номер участка)
    # Ограничиваем год: только 2 или 4 цифры, не может быть 1/500 или 1/2
    - '\b(?:[125]|2[аa]|13)\s*-\s*\d{1,6}(?:/\d{1,3})?\s*/\s*(?:\d{2}|\d{4})\b'

    # Арбитражное дело (АXX-номер/год) с поддержкой кириллицы и латиницы
    - '\b[АA][0-9]{1,3}\s*-\s*\d{1,6}\s*/\s*\d{4}\b'

  context:
    - 'судебный приказ'
    - 'приказ'
    - 'судебный приказ №'
    - 'приказ №'

    - 'взыскание'
    - 'долг'
    - 'задолженность'
    - 'алименты'
    - 'жкх'
    - 'жилищно-коммунальные услуги'
    - 'кредит'
    - 'займ'
    - 'расписка'

    - 'вынесен судебный приказ'
    - 'выдан судебный приказ'
    - 'отмена судебного приказа'
    - 'возражение'

    - 'мировой судья'
    - 'мировой суд'
    - 'судебный участок'


# ============================================
# НОМЕР ДЕЛА В СУДЕ ОБЩЕЙ ЮРИСДИКЦИИ (СОЮ)
# ============================================
COURT_CASE_SOJ_NUMBER:
  description: |
    Номер дела в суде общей юрисдикции (районный, городской, мировой судья, военный суд)
    
    Форматы согласно Инструкции по судебному делопроизводству:
    
    1. Районный/городской суд: Х-ХХХ/ГГГГ
       - 1-1005/2025 (уголовное)
       - 2-1234/2024 (гражданское)
       - 2а-45/2023 (административное)
       
    2. Мировой судья (с номером участка): Х-ХХХ/ХХХ/ГГГГ
       - 2-123/125/2024
       
    3. Апелляция/кассация: ХХ-ХХХ/ГГГГ
       - 22-5/2019 (уголовная апелляция)
       - 33-10/2019 (гражданская апелляция)
       - 33а-6/2019 (административная апелляция)
       
    4. Сложные форматы:
       - 1-3-35/2025 (с кодом здания суда)
       - 1-34/2025(2-134/2024) (двойной номер)
       - М-345/2025 (незавершенное производство)
       
    5. УИД (Уникальный идентификатор дела):
       - 77RS0001-01-2024-000001-01
       - 61RS0005-01-2023-000123-45

  patterns:
    # Районный/городской суд: индекс (1,2,2а,3,4,5,10,11,13) - номер/год
    - '\b(?:[1-5]|2[аa]|1[013])\s*-\s*\d{1,6}\s*/\s*\d{4}\b'

    # Мировой судья: индекс - номер/номер участка/год
    - '\b(?:[1-5]|2[аa])\s*-\s*\d{1,6}\s*/\s*\d{1,3}\s*/\s*\d{4}\b'

    # С кодом здания суда: индекс-код-номер/год
    - '\b[1-5]\s*-\s*\d{1,2}\s*-\s*\d{1,6}\s*/\s*\d{4}\b'

    # Двойной номер (апелляция/кассация с делом первой инстанции в скобках)
    - '\b[1-9][0-9]?[аa]?\s*-\s*\d{1,6}\s*/\s*\d{4}\s*\(\s*[1-9][0-9]?[аa]?\s*-\s*\d{1,6}\s*/\s*\d{4}\s*\)\b'

    # Незавершенное производство (М-номер/год) с поддержкой латиницы
    - '\b[МM]\s*-\s*\d{1,6}\s*/\s*\d{4}\b'

    # УИД (Уникальный идентификатор дела)
    - '\b\d{2}[А-ЯA-Z]{2}\d{4}-\d{2}-\d{4}-\d{6}-\d{2}\b'

  context:
    - 'уголовное дело'
    - 'гражданское дело'
    - 'административное дело'
    - 'дело №'
    - 'дело N'
    - 'номер дела'
    - 'уид'

    - 'суд'
    - 'районный суд'
    - 'городской суд'
    - 'мировой судья'
    - 'мировой суд'
    - 'судебный участок'
    - 'военный суд'

    - 'рассмотрение дела'
    - 'возбуждено дело'
    - 'решение по делу'
    - 'постановление'
    - 'определение'
    - 'приговор'
    - 'иск'
    - 'истец'
    - 'ответчик'
    - 'обвиняемый'
    - 'подсудимый'