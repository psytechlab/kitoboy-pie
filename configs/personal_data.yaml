# ============================================
# Персонально-биографические данные
# ============================================

# ============================================
# ВОЗРАСТ
# ============================================
AGE:
  description: |
    Age
    Не шумные форматы, однако они покрывают лишь малую часть, 
    потому необходимо использовать более сложные модели
    
    Формат:
    1. Прямое указание с ключевыми словами (лет, год, года)
    2. Год рождения в формате "г.р."

  patterns:
    # 25 лет, 25 года, 25 год (до 99 лет)
    - '\b\d{1,2}\s*(?:лет|года?)\b'

    # 1990 г.р., 1990 гр, 1990 г.р (только 1900-2029 гг.)
    - '\b(?:19\d{2}|20[0-2]\d)\s*г\.?р\.?\b'

  context:
    - 'лет'
    - 'год'
    - 'года'
    - 'г.р.'
    - 'возраст'
    - 'рождения'
    - 'рождение'


# ============================================
# ДАТА РОЖДЕНИЯ
# ============================================
BIRTH_DATE:
  description: |
    Дата рождения человека — очень шумная сущность, 
    без проверки контекста ловит просто даты и цифры с разделителями.
    
    Формат:
    1. Цифровой: ДД.ММ.ГГГГ, ДД/ММ/ГГГГ, ДД-ММ-ГГГГ
    2. Словами: ДД месяц ГГГГ

  patterns:
    # Цифровой формат (только 4-значный год, без 2-значного!)
    - '\b(?:0[1-9]|[12][0-9]|3[01])[./-](?:0[1-9]|1[0-2])[./-](?:19\d{2}|20[0-2]\d)\b'

    # Словами: 15 марта 1999
    - '\b(?:0[1-9]|[12][0-9]|3[01])\s+(?:январ[ья]|феврал[ья]|март[а]?|апрел[ья]|ма[яй]|июн[ья]|июл[ья]|август[а]?|сентябр[ья]|октябр[ья]|ноябр[ья]|декабр[ья])\s+(?:19\d{2}|20[0-2]\d)\b'

  context:
    - 'родился'
    - 'родилась'
    - 'день рождения'
    - 'др'
    - 'дата рождения'
    - 'д.р.'
    - 'дата рожд'
    - 'г.р.'
    - 'появился на свет'
    - 'появилась на свет'