# ============================================
# АВИТО (РАБОТА)
# ============================================
AVITO:
  description: |
    Авито Работа — Russian platform career section 
    
    Особенности платформы:
    - У резюме соискателей нет публичных ссылок 
    - Работодатели видят резюме только через интерфейс при отклике 
    - Публичные ссылки есть только на вакансии (идентифицируют работодателя, не соискателя)
    - Из мобильного приложения делятся короткими ссылками avito.ru/i/12345678
    
    Что можно ловить регулярками:
    - Ссылки на вакансии 
    - Ссылки на профили компаний
    - Короткие мобильные ссылки (avito.ru/i/...)

  patterns:
    # Короткие мобильные ссылки (из приложения)
    - '(?:https?://)?(?:www\.)?avito\.ru/i/\d+\b'

    # Вакансии (с мобильным поддоменом)
    - '(?:https?://)?(?:m\.)?avito\.ru/[a-z0-9_-]+/vacancy/[a-z0-9_-]+/\d+/?'
    - '(?:https?://)?(?:m\.)?avito\.ru/[a-z0-9_-]+/vakansii/[a-z0-9_-]+/\d+/?'

    # Компании на Авито
    - '(?:https?://)?(?:m\.)?avito\.ru/company/[a-z0-9_-]+/?'

    # Общие ссылки на раздел Работа
    - '(?:https?://)?(?:m\.)?avito\.ru/rabota/?'
    - '(?:https?://)?(?:m\.)?avito\.ru/[a-z0-9_-]+/rabota/?'

  context:
    - 'avito работа'
    - 'авито работа'

    - 'вакансия на авито'
    - 'работа на авито'

    - 'резюме'
    - 'резюме на авито'
    - 'cv'
    - 'анкета'
    - 'сиви'

    - 'ищу работу'
    - 'вакансия'
    - 'связаться'

    - 'соискатель'
    - 'работодатель'
    - 'рекрутер'
